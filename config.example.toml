# Example tartarus_driver key remap config.
#
# This file documents the config.toml schema and shows the built-in
# placeholder defaults (the same values tartarus_driver falls back to when
# config.toml doesn't exist at all, or a specific entry is missing). Copy
# this to config.toml and edit it, or just use `cargo run --release --
# configui` and edit it from the browser instead — either way produces the
# same file format.
#
# Every value is a key name from a closed vocabulary: single digits "0".."9",
# single letters "A".."Z", "F1".."F24", the arrow keys "LEFT"/"UP"/"RIGHT"/
# "DOWN", these named keys: "SPACE", "ENTER", "TAB", "ESCAPE", "BACKSPACE",
# "LSHIFT", "RSHIFT", "LCTRL", "RCTRL", "LALT", "RALT", "HOME", "END",
# "PAGEUP", "PAGEDOWN", "INSERT", "DELETE", and these media/volume keys (new
# in v1.0.5): "MEDIA_PLAY_PAUSE", "MEDIA_STOP", "MEDIA_NEXT", "MEDIA_PREV",
# "VOLUME_MUTE", "VOLUME_DOWN", "VOLUME_UP". An unrecognized name (typo,
# wrong case handled automatically but an unknown word is not) falls back to
# the built-in default for that one entry and prints a warning to
# logs/run.log — it never crashes the driver or breaks other entries.
#
# [keys.default] / [keys.layer1] / [keys.layer2]: the 20 analog keys, numbered
# key01..key20 matching the number printed on each physical keycap.
# [keys.default] is the normal (Default) layer. [keys.layer1]/[keys.layer2]
# are only reachable depending on [hypershift] below: with the default
# mode/switch_style (layer_switch/momentary), only layer1 is ever used, while
# the "Hyper Response" thumb button is held — layer2 is stored but inert.
# Switching switch_style to "toggle" with layer_count = 3 makes the button
# cycle Default -> Layer1 -> Layer2 -> Default on every press instead.

[keys.default]
key01 = "1"
key02 = "2"
key03 = "3"
key04 = "4"
key05 = "5"
key06 = "6"
key07 = "7"
key08 = "8"
key09 = "9"
key10 = "0"
key11 = "A"
key12 = "B"
key13 = "C"
key14 = "D"
key15 = "E"
key16 = "F"
key17 = "G"
key18 = "H"
key19 = "I"
key20 = "J"

[keys.layer1]
key01 = "F1"
key02 = "F2"
key03 = "F3"
key04 = "F4"
key05 = "F5"
key06 = "F6"
key07 = "F7"
key08 = "F8"
key09 = "F9"
key10 = "F10"
key11 = "F11"
key12 = "F12"
key13 = "F13"
key14 = "F14"
key15 = "F15"
key16 = "F16"
key17 = "F17"
key18 = "F18"
key19 = "F19"
key20 = "F20"

# Only reachable in [hypershift] switch_style = "toggle", layer_count = 3
# (see below); harmless to leave at its built-in default otherwise.
[keys.layer2]
key01 = "LEFT"
key02 = "UP"
key03 = "RIGHT"
key04 = "DOWN"
key05 = "SPACE"
key06 = "ENTER"
key07 = "TAB"
key08 = "ESCAPE"
key09 = "BACKSPACE"
key10 = "LSHIFT"
key11 = "RSHIFT"
key12 = "LCTRL"
key13 = "RCTRL"
key14 = "LALT"
key15 = "RALT"
key16 = "HOME"
key17 = "END"
key18 = "PAGEUP"
key19 = "PAGEDOWN"
key20 = "INSERT"

# What the physical "Hyper Response" thumb button does (new in v1.0.5).
#   mode: "layer_switch" (default) - the button drives [keys.layer1]/
#     [keys.layer2] above; "modifier_key" - layer switching is disabled
#     entirely and the button just sends modifier_key on press/release, like
#     any other key.
#   switch_style: only used when mode = "layer_switch". "momentary" (default,
#     original v1.0.0-v1.0.4 behavior) - held selects Layer1, released
#     returns to Default (always exactly 2 layers, layer_count is ignored).
#     "toggle" - every press advances one layer (Default -> Layer1 ->
#     (Layer2 ->) Default ...); release does nothing.
#   layer_count: only used when switch_style = "toggle". 2 or 3.
#   modifier_key: only used when mode = "modifier_key". Any key name from the
#     vocabulary above.
[hypershift]
mode = "layer_switch"
switch_style = "momentary"
layer_count = 2
modifier_key = "LALT"

# The 8-way D-pad's four directions.
[dpad]
left = "K"
up = "W"
right = "L"
down = "S"

# The scroll wheel taps this key once per notch rolled.
[wheel]
up = "O"
down = "P"

# The wheel's click-in (middle-button) action.
[middle_click]
key = "M"

# Hysteresis thresholds on the raw 0-255 analog depth scale (see docs/DESIGN.md
# §6.1). t_off MUST be strictly less than t_on; an invalid pair falls back
# to these same built-in defaults for both values together.
[actuation]
t_on = 100
t_off = 80

# LED lighting (see docs/DESIGN.md §6④). effect = "none" (the default, also
# used when this whole section is omitted) means "don't touch the LEDs at
# all" — the device keeps whatever effect/color it already had. Any other
# effect is (re-)sent once at every driver startup.
#   effect: "none" | "off" | "static" | "breathing" | "spectrum" | "wave" | "reactive"
#   color: "RRGGBB" hex, used by static/breathing/reactive
#   brightness: 0-255
#   wave_direction: "left" | "right", used by wave
#   reactive_speed: 1-4, used by reactive
[lighting]
effect = "none"
color = "FFFFFF"
brightness = 255
wave_direction = "left"
reactive_speed = 2
